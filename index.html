<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adhul U Krishna | Video Editor</title>
    <meta
      name="description"
      content="Adhul U Krishna, video editor. Short-form edits built on storytelling and finished with visual effects, colour grading and sound design."
    />
    <meta name="theme-color" content="#08110F" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adhul U Krishna | Video Editor" />
    <meta
      property="og:description"
      content="Adhul U Krishna, video editor. Short-form edits built on storytelling and finished with visual effects, colour grading and sound design."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Runs before first paint. "js" unlocks the reveal styles. The opener
      // ("Reframe") plays once per visit, never under reduced motion: a 9:16
      // frame drawn in light edits the name in, then reframes out to the
      // full screen. The reframe waits until the page has rendered (React
      // sends "ak:ready"), so it always opens onto the hero, never onto an
      // empty page; "is-ready" starts the hero as the frame opens.
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        var intro = false;
        try {
          intro =
            !matchMedia("(prefers-reduced-motion: reduce)").matches &&
            !sessionStorage.getItem("ak-leader");
          if (intro) sessionStorage.setItem("ak-leader", "1");
        } catch (e) {}
        function ready() {
          d.classList.add("is-ready");
        }
        if (!intro) {
          requestAnimationFrame(ready);
          return;
        }
        // The largest 9:16 frame that sits comfortably on this screen, and
        // how far each edge must scale to reach the screen's edges.
        var vw = innerWidth;
        var vh = innerHeight;
        var fh = Math.min(vh * 0.64, 660);
        var fw = (fh * 9) / 16;
        if (fw > vw * 0.78) {
          fw = vw * 0.78;
          fh = (fw * 16) / 9;
        }
        var s = d.style;
        s.setProperty("--op-fw", fw.toFixed(1) + "px");
        s.setProperty("--op-fh", fh.toFixed(1) + "px");
        s.setProperty("--op-sx", (vw / fw).toFixed(3));
        s.setProperty("--op-sy", (vh / fh).toFixed(3));
        d.classList.add("has-intro");

        // The build runs on CSS animations, which start when the stylesheet
        // arrives, not when this script runs. So the clock starts with the
        // first opener animation, and the reframe waits for both the build
        // (1.05 s) and the page.
        var t0 = performance.now();
        var app = false;
        var built = false;
        var went = false;
        var tGo = 0;
        var tDone = 0;
        var tCap = setTimeout(go, 3200); // never hold the visitor longer
        function onStart(e) {
          if (e.animationName !== "op-on") return;
          removeEventListener("animationstart", onStart);
          t0 = performance.now() - 80; // op-on starts after an 80 ms delay
          tGo = setTimeout(function () {
            built = true;
            if (app) go();
          }, 970);
        }
        addEventListener("animationstart", onStart);
        addEventListener(
          "ak:ready",
          function () {
            app = true;
            if (built) go();
          },
          { once: true },
        );
        function go() {
          if (went) return;
          went = true;
          clearTimeout(tGo);
          clearTimeout(tCap);
          ready();
          d.classList.add("is-reframe");
          tDone = setTimeout(done, 840);
        }
        // Running timecode at 24 fps until the reframe.
        (function count() {
          var el = document.getElementById("opener-tc");
          var f = Math.floor(((performance.now() - t0) / 1000) * 24);
          if (el)
            el.textContent =
              "00:00:" +
              ("0" + Math.floor(f / 24)).slice(-2) +
              ":" +
              ("0" + (f % 24)).slice(-2);
          if (!went && d.classList.contains("has-intro"))
            requestAnimationFrame(count);
        })();
        function done() {
          clearTimeout(tGo);
          clearTimeout(tCap);
          clearTimeout(tDone);
          went = true;
          ready();
          d.classList.remove("has-intro", "is-reframe");
          removeEventListener("animationstart", onStart);
          removeEventListener("keydown", done);
          removeEventListener("pointerdown", done);
        }
        addEventListener("keydown", done);
        addEventListener("pointerdown", done);
      })();
    </script>
  </head>
  <body>
    <!-- "Reframe" opener, shown only while "has-intro" is set. Four panels
         surround a 9:16 window; each carries one edge of the light frame,
         so when they slide apart the frame grows to the full screen. -->
    <div class="opener" aria-hidden="true">
      <div class="op__screen">
        <div class="op__ui">
          <p class="op__top">
            <span class="op__rec"></span><b id="opener-tc">00:00:00:00</b
            ><span class="op__ar">9:16</span>
          </p>
          <p class="op__name">
            <span class="op__l1"
              ><span style="--d: 150">A</span><span style="--d: 200">D</span
              ><span style="--d: 250">H</span><span style="--d: 300">U</span
              ><span style="--d: 350">L</span></span
            >
            <span class="op__l2"
              ><span style="--d: 390">U</span><span class="op__gap"></span
              ><span style="--d: 430">K</span><span style="--d: 460">R</span
              ><span style="--d: 490">I</span><span style="--d: 520">S</span
              ><span style="--d: 550">H</span><span style="--d: 575">N</span
              ><span style="--d: 600">A</span></span
            >
          </p>
          <p class="op__role">Video Editor</p>
          <div class="op__scrub">
            <span class="op__played"></span><span class="op__head"></span>
          </div>
        </div>
      </div>
      <div class="op__panel op__panel--t">
        <span class="op__edge op__edge--h"><i class="op__line"></i></span>
      </div>
      <div class="op__panel op__panel--b">
        <span class="op__edge op__edge--h"><i class="op__line"></i></span>
      </div>
      <div class="op__panel op__panel--l">
        <span class="op__edge op__edge--v"><i class="op__line"></i></span>
      </div>
      <div class="op__panel op__panel--r">
        <span class="op__edge op__edge--v"><i class="op__line"></i></span>
      </div>
    </div>

    <div id="root"></div>

    <noscript>
      <main class="noscript wrap">
        <h1>Adhul U Krishna, Video Editor</h1>
        <p>
          I cut stories that stop the scroll, built on storytelling and finished
          with visual effects, colour grading and sound design. Based in
          Kanyakumari District, Tamil Nadu, India.
        </p>
        <p><a href="mailto:akadhul@gmail.com">akadhul@gmail.com</a></p>
        <p>Turn on JavaScript to watch the edits.</p>
      </main>
    </noscript>

    <!-- Netlify Forms reads this at deploy time to register the "contact"
         form; the React form posts the same fields to it. Never shown. -->
    <form name="contact" data-netlify="true" netlify-honeypot="website" hidden>
      <input name="name" />
      <input name="email" type="email" />
      <input name="project" />
      <textarea name="message"></textarea>
      <input name="website" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
